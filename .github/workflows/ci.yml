name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
